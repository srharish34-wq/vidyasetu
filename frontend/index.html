<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>VidyaSetu &ndash; Adaptive Smart Learning Companion</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Noto+Sans+Tamil:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head><body>
<div id="app"></div>
<script>
function showErr(m){document.getElementById('app').innerHTML='<div style="max-width:640px;margin:60px auto;padding:24px;font-family:sans-serif;background:#fff0f3;border:2px solid #f03e5e;border-radius:16px"><h2>VidyaSetu could not start</h2><p style="margin:10px 0">'+m+'</p><p>Check that your folder looks like:<br><code>frontend/index.html<br>frontend/css/style.css<br>frontend/js/data.js<br>frontend/js/app.js</code></p></div>'}
window.onerror=function(m,s,l){showErr(m+' (file: '+String(s).split('/').pop()+', line '+l+')')};
</script>
<script charset="utf-8" src="js/data.js" onerror="showErr('Cannot find js/data.js')"></script>
<script charset="utf-8" src="js/app.js" onerror="showErr('Cannot find js/app.js')"></script>
</body></html>
